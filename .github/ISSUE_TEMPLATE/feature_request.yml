name: Feature request
description: Suggest something that would help your analysis
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the research task, e.g. "compare how two cohorts talk about workload".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Sift QDA, another tool, or by hand.
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: field
    attributes:
      label: Your field or use case
      placeholder: "UX research, public health, M&E, journalism..."
