[package]
name = "sift-qda"
version = "0.2.0"
description = "Sift QDA: local-first qualitative data analysis"
authors = ["Sift QDA contributors"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
keywords = ["qualitative-research", "caqdas", "thematic-analysis", "refi-qda", "tauri"]
categories = ["science", "text-processing"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "sift_qda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4"] }
# Storage
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
# Document parsing
office_oxide = "0.1.11"
calamine = "0.36.1"
pdf-extract = "0.12.0"
# REFI-QDA (.qdpx = zip of XML + plain text)
zip = "8.6.0"
roxmltree = "0.21"
# Text analysis (word boundaries follow Unicode rules, so Hindi and other scripts count correctly)
unicode-segmentation = "1.13.3"
stop-words = "0.10.0"
# Local embeddings through Ollama on localhost (plain HTTP, so no TLS stack)
ureq = { version = "3.4", default-features = false, features = ["json"] }

# https://tauri.app/concept/size/#cargo-configuration
# panic stays "unwind" so a malformed PDF can be caught instead of aborting the app.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
